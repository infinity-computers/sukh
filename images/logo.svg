<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#B1764E" opacity="0.15"/>
  
  <!-- House shape -->
  <g transform="translate(50, 50)">
    <!-- Roof -->
    <path d="M -20 -5 L 0 -25 L 20 -5 Z" fill="#B1764E" stroke="#1F1F1F" stroke-width="1.5"/>
    
    <!-- House body -->
    <rect x="-20" y="-5" width="40" height="25" fill="none" stroke="#B1764E" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="-8" y="10" width="8" height="15" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
    <circle cx="-2" cy="17.5" r="1.5" fill="#1F1F1F"/>
    
    <!-- Windows -->
    <rect x="2" y="-2" width="6" height="6" fill="#1F1F1F"/>
    <line x1="5" y1="-2" x2="5" y2="4"/>
    <line x1="2" y1="1" x2="8" y2="1"/>
    
    <rect x="10" y="-2" width="6" height="6" fill="#1F1F1F"/>
    <line x1="13" y1="-2" x2="13" y2="4"/>
    <line x1="10" y1="1" x2="16" y2="1"/>
  </g>
</svg>